<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>SenseForge Sandbox</title></head>
<body>
<script>
// --- Internal State ---
let canvas, ctx;
let animationId = null;
let running = false;
let paused = false;
let frameCount = 0;
let lastTime = 0;
let deltaTime = 0;
let canvasWidth = 800;
let canvasHeight = 600;

const mouse = { x: 0, y: 0, pressed: false };
const keysPressed = new Set();

// --- Particle System ---
const _particles = [];
const MAX_PARTICLES = 2000;

function _createParticle(opts) {
  const angle = (opts.angle || 0) + (Math.random() - 0.5) * (opts.spread || Math.PI * 2);
  const speed = _resolveRange(opts.speed || [1, 3]);
  const life = _resolveRange(opts.life || [0.5, 2]);
  const size = _resolveRange(opts.size || [2, 6]);
  const colors = opts.color || '#ffffff';
  let color;
  if (Array.isArray(colors) && typeof colors[0] === 'string') {
    color = colors[Math.floor(Math.random() * colors.length)];
  } else {
    color = typeof colors === 'number' ? `rgb(${colors},${colors},${colors})` : colors;
  }
  return {
    x: opts.x, y: opts.y,
    vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
    size, life, maxLife: life,
    color, gravity: opts.gravity || 0, glow: opts.glow || false
  };
}

function _resolveRange(v) {
  return typeof v === 'number' ? v : v[0] + Math.random() * (v[1] - v[0]);
}

function _updateParticles(dt) {
  for (let i = _particles.length - 1; i >= 0; i--) {
    const p = _particles[i];
    p.life -= dt;
    if (p.life <= 0) { _particles.splice(i, 1); continue; }
    p.vy += p.gravity * dt;
    p.x += p.vx;
    p.y += p.vy;
  }
}

function _renderParticles() {
  for (const p of _particles) {
    const alpha = Math.max(0, p.life / p.maxLife);
    const size = p.size * alpha;
    ctx.save();
    ctx.globalAlpha = alpha;
    if (p.glow) { ctx.shadowColor = p.color; ctx.shadowBlur = size * 2; }
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

// --- Perlin Noise ---
const _PSIZE = 256;
const _perm = [];
(function initPerlin() {
  for (let i = 0; i < _PSIZE; i++) _perm[i] = i;
  for (let i = _PSIZE - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [_perm[i], _perm[j]] = [_perm[j], _perm[i]];
  }
  for (let i = 0; i < _PSIZE; i++) _perm[_PSIZE + i] = _perm[i];
})();

function _fade(t) { return t * t * t * (t * (t * 6 - 15) + 10); }
function _grad(hash, x, y) {
  const h = hash & 3;
  const u = h < 2 ? x : y;
  const v = h < 2 ? y : x;
  return (h & 1 ? -u : u) + (h & 2 ? -v : v);
}

function _noise(x, y) {
  const xi = Math.floor(x) & (_PSIZE - 1);
  const yi = Math.floor(y) & (_PSIZE - 1);
  const xf = x - Math.floor(x);
  const yf = y - Math.floor(y);
  const u = _fade(xf);
  const v = _fade(yf);
  const aa = _perm[_perm[xi] + yi];
  const ab = _perm[_perm[xi] + yi + 1];
  const ba = _perm[_perm[xi + 1] + yi];
  const bb = _perm[_perm[xi + 1] + yi + 1];
  const x1 = _lerp(_grad(aa, xf, yf), _grad(ba, xf - 1, yf), u);
  const x2 = _lerp(_grad(ab, xf, yf - 1), _grad(bb, xf - 1, yf - 1), u);
  return (_lerp(x1, x2, v) + 1) / 2;
}

function _lerp(a, b, t) { return a + (b - a) * t; }

// --- Canvas Drawing State ---
let _fillColor = '#ffffff';
let _strokeColor = '#ffffff';
let _strokeW = 1;
let _doFill = true;
let _doStroke = true;

function _resolveColor(c) {
  return typeof c === 'number' ? `rgb(${c & 255},${c & 255},${c & 255})` : c;
}

function _applyFS() {
  if (_doFill) { ctx.fillStyle = _fillColor; ctx.fill(); }
  if (_doStroke) { ctx.strokeStyle = _strokeColor; ctx.lineWidth = _strokeW; ctx.stroke(); }
}

// --- Init Canvas ---
function initCanvas(w, h) {
  canvasWidth = w;
  canvasHeight = h;
  canvas = new OffscreenCanvas(w, h);
  ctx = canvas.getContext('2d');
}

initCanvas(800, 600);

// --- Global API (exposed to user code) ---
window.width = canvasWidth;
window.height = canvasHeight;
window.mouseX = 0;
window.mouseY = 0;
window.mousePressed = false;
window.frameCount = 0;
window.deltaTime = 0;

// Canvas primitives
window.background = function(color) {
  const c = _resolveColor(color);
  ctx.save(); ctx.resetTransform();
  ctx.fillStyle = c;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.restore();
};
window.fill = function(color) { _fillColor = _resolveColor(color); _doFill = true; };
window.noFill = function() { _doFill = false; };
window.stroke = function(color) { _strokeColor = _resolveColor(color); _doStroke = true; };
window.noStroke = function() { _doStroke = false; };
window.strokeWeight = function(w) { _strokeW = w; };

window.circle = function(x, y, r) {
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); _applyFS();
};
window.rect = function(x, y, w, h) {
  ctx.beginPath(); ctx.rect(x, y, w, h); _applyFS();
};
window.line = function(x1, y1, x2, y2) {
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
  ctx.strokeStyle = _strokeColor; ctx.lineWidth = _strokeW; ctx.stroke();
};
window.ellipse = function(x, y, rx, ry, rot) {
  ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot || 0, 0, Math.PI * 2); _applyFS();
};
window.triangle = function(x1, y1, x2, y2, x3, y3) {
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.lineTo(x3, y3);
  ctx.closePath(); _applyFS();
};

window.push = function() { ctx.save(); };
window.pop = function() { ctx.restore(); };
window.translate = function(x, y) { ctx.translate(x, y); };
window.rotate = function(a) { ctx.rotate(a); };
window.scale = function(x, y) { ctx.scale(x, y === undefined ? x : y); };

// Particles
window.particles = {
  emit: function(opts) {
    const count = opts.count || 1;
    for (let i = 0; i < count && _particles.length < MAX_PARTICLES; i++)
      _particles.push(_createParticle(opts));
  },
  burst: function(opts) {
    const count = opts.count || 20;
    for (let i = 0; i < count && _particles.length < MAX_PARTICLES; i++)
      _particles.push(_createParticle({ spread: Math.PI * 2, ...opts }));
  }
};

// Audio (proxy to host)
window.audio = {
  playTone: function(params) {
    parent.postMessage({ type: 'audio', action: 'playTone', params: params }, '*');
  }
};

// Utilities
window.random = function(min, max) {
  if (min === undefined) return Math.random();
  if (max === undefined) { max = min; min = 0; }
  return min + Math.random() * (max - min);
};
window.map = function(v, inMin, inMax, outMin, outMax) {
  return outMin + ((v - inMin) / (inMax - inMin)) * (outMax - outMin);
};
window.lerp = function(a, b, t) { return a + (b - a) * t; };
window.noise = _noise;

window.sf = {
  get width() { return canvasWidth; },
  get height() { return canvasHeight; },
  get frameCount() { return frameCount; },
  get deltaTime() { return deltaTime; },
  mouse: mouse,
  keys: { pressed: keysPressed },
  canvas: {
    background: window.background, fill: window.fill, noFill: window.noFill,
    stroke: window.stroke, noStroke: window.noStroke, strokeWeight: window.strokeWeight,
    circle: window.circle, rect: window.rect, line: window.line,
    ellipse: window.ellipse, triangle: window.triangle,
    push: window.push, pop: window.pop,
    translate: window.translate, rotate: window.rotate, scale: window.scale
  },
  particles: window.particles,
  audio: window.audio,
  random: window.random, map: window.map, lerp: window.lerp, noise: window.noise
};

// --- User Code Execution ---
let userSetup = null;
let userDraw = null;

function executeCode(code) {
  resetAll();
  try {
    window.setup = undefined;
    window.draw = undefined;
    (0, eval)(code);
    userSetup = window.setup || null;
    userDraw = window.draw || null;
    if (userSetup) userSetup();
    running = true;
    paused = false;
    lastTime = performance.now();
    animationId = requestAnimationFrame(loop);
    parent.postMessage({ type: 'log', message: 'Code running...' }, '*');
  } catch (e) {
    parent.postMessage({ type: 'error', message: e.message }, '*');
  }
}

function resetAll() {
  running = false;
  paused = false;
  if (animationId) cancelAnimationFrame(animationId);
  animationId = null;
  frameCount = 0;
  deltaTime = 0;
  _particles.length = 0;
  _fillColor = '#ffffff';
  _strokeColor = '#ffffff';
  _strokeW = 1;
  _doFill = true;
  _doStroke = true;
  userSetup = null;
  userDraw = null;
  initCanvas(canvasWidth, canvasHeight);
  window.frameCount = 0;
  window.deltaTime = 0;
}

// --- Animation Loop ---
function loop(timestamp) {
  if (!running || paused) return;
  deltaTime = Math.min((timestamp - lastTime) / 1000, 0.1);
  lastTime = timestamp;
  frameCount++;
  window.frameCount = frameCount;
  window.deltaTime = deltaTime;
  window.width = canvasWidth;
  window.height = canvasHeight;
  window.mouseX = mouse.x;
  window.mouseY = mouse.y;
  window.mousePressed = mouse.pressed;

  try {
    if (userDraw) userDraw();
    _updateParticles(deltaTime);
    _renderParticles();
    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const copy = imageData.data.slice().buffer;
    parent.postMessage({ type: 'frame', width: canvas.width, height: canvas.height, buffer: copy }, '*');
  } catch (e) {
    parent.postMessage({ type: 'error', message: e.message }, '*');
    running = false;
    return;
  }
  animationId = requestAnimationFrame(loop);
}

// --- Message Handler ---
window.addEventListener('message', function(e) {
  const msg = e.data;
  if (!msg || !msg.type) return;
  switch (msg.type) {
    case 'execute':
      executeCode(msg.code);
      break;
    case 'control':
      if (msg.action === 'pause') { paused = true; }
      else if (msg.action === 'resume') {
        if (paused) { paused = false; lastTime = performance.now(); animationId = requestAnimationFrame(loop); }
      }
      else if (msg.action === 'reset') { resetAll(); }
      break;
    case 'mouse':
      mouse.x = msg.x; mouse.y = msg.y; mouse.pressed = msg.pressed;
      break;
    case 'key':
      if (msg.pressed) keysPressed.add(msg.key);
      else keysPressed.delete(msg.key);
      break;
    case 'resize':
      initCanvas(msg.width, msg.height);
      break;
  }
});

parent.postMessage({ type: 'ready' }, '*');
</script>
</body>
</html>
