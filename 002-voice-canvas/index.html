<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voice Canvas - 소리로 그리는 캔버스</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0a0e1a;
    --surface: rgba(255,255,255,0.06);
    --surface-hover: rgba(255,255,255,0.12);
    --text: #e2e8f0;
    --text-dim: #64748b;
    --accent: #6366f1;
    --accent-glow: rgba(99,102,241,0.3);
    --border: rgba(255,255,255,0.08);
    --radius: 12px;
  }

  body {
    font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
    height: 100vh;
    width: 100vw;
    user-select: none;
  }

  /* ── Landing ── */
  #landing {
    position: fixed; inset: 0; z-index: 100;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: var(--bg);
    transition: opacity 0.6s, visibility 0.6s;
  }
  #landing.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

  .landing-icon {
    width: 100px; height: 100px;
    border-radius: 50%;
    background: linear-gradient(135deg, #6366f1, #a855f7, #ec4899);
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 32px;
    animation: pulse-glow 2s ease-in-out infinite;
  }
  @keyframes pulse-glow {
    0%, 100% { box-shadow: 0 0 30px var(--accent-glow); transform: scale(1); }
    50% { box-shadow: 0 0 60px var(--accent-glow); transform: scale(1.05); }
  }
  .landing-icon svg { width: 48px; height: 48px; fill: white; }

  #landing h1 {
    font-size: 2.5rem; font-weight: 700;
    background: linear-gradient(135deg, #6366f1, #a855f7, #ec4899);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    margin-bottom: 12px;
  }
  #landing p { color: var(--text-dim); font-size: 1.1rem; margin-bottom: 40px; }

  .start-btn {
    padding: 16px 48px;
    background: linear-gradient(135deg, #6366f1, #a855f7);
    border: none; border-radius: 50px;
    color: white; font-size: 1.1rem; font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .start-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 30px var(--accent-glow);
  }

  .landing-features {
    display: flex; gap: 32px;
    margin-top: 48px;
  }
  .landing-feature {
    text-align: center; max-width: 160px;
  }
  .landing-feature .feat-icon {
    width: 48px; height: 48px;
    border-radius: 12px;
    background: var(--surface);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 12px;
    font-size: 1.4rem;
  }
  .landing-feature h3 { font-size: 0.9rem; font-weight: 600; margin-bottom: 4px; }
  .landing-feature p { font-size: 0.75rem; color: var(--text-dim); }

  /* ── Canvas ── */
  #canvas {
    position: fixed; inset: 0;
    background: var(--bg);
  }

  /* ── Top Bar ── */
  .top-bar {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
    z-index: 10;
    display: flex; align-items: center; gap: 8px;
    padding: 6px 8px;
    background: rgba(15,18,30,0.85);
    backdrop-filter: blur(20px);
    border: 1px solid var(--border);
    border-radius: 50px;
    opacity: 0; transition: opacity 0.4s;
  }
  .top-bar.visible { opacity: 1; }

  .mode-btn {
    padding: 8px 18px;
    background: transparent;
    border: 1px solid transparent;
    border-radius: 50px;
    color: var(--text-dim);
    font-size: 0.82rem; font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.25s;
  }
  .mode-btn.active {
    background: var(--surface-hover);
    border-color: var(--border);
    color: var(--text);
  }
  .mode-btn:hover:not(.active) {
    color: var(--text);
    background: var(--surface);
  }

  .bar-divider {
    width: 1px; height: 24px;
    background: var(--border);
    margin: 0 4px;
  }

  /* ── Volume Meter ── */
  .vol-meter {
    display: flex; align-items: center; gap: 6px;
    padding: 0 8px;
  }
  .vol-meter svg { width: 16px; height: 16px; fill: var(--text-dim); }
  .vol-bar-wrap {
    width: 80px; height: 4px;
    background: var(--surface);
    border-radius: 2px;
    overflow: hidden;
  }
  .vol-bar-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #6366f1, #a855f7, #ec4899);
    border-radius: 2px;
    transition: width 0.05s;
  }

  /* ── Side Toolbar ── */
  .side-bar {
    position: fixed; right: 16px; top: 50%; transform: translateY(-50%);
    z-index: 10;
    display: flex; flex-direction: column; gap: 6px;
    padding: 8px;
    background: rgba(15,18,30,0.85);
    backdrop-filter: blur(20px);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    opacity: 0; transition: opacity 0.4s;
  }
  .side-bar.visible { opacity: 1; }

  .tool-btn {
    width: 40px; height: 40px;
    background: transparent;
    border: 1px solid transparent;
    border-radius: 10px;
    color: var(--text-dim);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
    position: relative;
  }
  .tool-btn:hover {
    background: var(--surface);
    color: var(--text);
  }
  .tool-btn svg { width: 18px; height: 18px; fill: currentColor; }
  .tool-btn .tooltip {
    position: absolute; right: 52px; top: 50%; transform: translateY(-50%);
    padding: 4px 10px;
    background: rgba(0,0,0,0.8);
    border-radius: 6px;
    font-size: 0.72rem;
    white-space: nowrap;
    opacity: 0; pointer-events: none;
    transition: opacity 0.2s;
  }
  .tool-btn:hover .tooltip { opacity: 1; }

  /* ── Frequency Legend ── */
  .freq-legend {
    position: fixed; left: 16px; bottom: 16px;
    z-index: 10;
    display: flex; flex-direction: column; gap: 4px;
    padding: 12px;
    background: rgba(15,18,30,0.85);
    backdrop-filter: blur(20px);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    opacity: 0; transition: opacity 0.4s;
  }
  .freq-legend.visible { opacity: 1; }
  .freq-legend h4 {
    font-size: 0.7rem; color: var(--text-dim);
    text-transform: uppercase; letter-spacing: 0.5px;
    margin-bottom: 4px;
  }
  .legend-row {
    display: flex; align-items: center; gap: 8px;
    font-size: 0.72rem; color: var(--text-dim);
  }
  .legend-swatch {
    width: 14px; height: 14px;
    border-radius: 50%;
  }

  /* ── Pitch Display ── */
  .pitch-display {
    position: fixed; left: 16px; top: 16px;
    z-index: 10;
    padding: 10px 16px;
    background: rgba(15,18,30,0.85);
    backdrop-filter: blur(20px);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    opacity: 0; transition: opacity 0.4s;
    min-width: 120px;
  }
  .pitch-display.visible { opacity: 1; }
  .pitch-display .label {
    font-size: 0.65rem; color: var(--text-dim);
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  .pitch-display .value {
    font-size: 1.4rem; font-weight: 700;
    margin-top: 2px;
  }
  .pitch-display .hz {
    font-size: 0.75rem; color: var(--text-dim);
    margin-top: 2px;
  }

  /* ── Toast ── */
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
    padding: 12px 24px;
    background: rgba(15,18,30,0.9);
    backdrop-filter: blur(20px);
    border: 1px solid var(--border);
    border-radius: 50px;
    font-size: 0.85rem; color: var(--text);
    z-index: 50;
    opacity: 0;
    transition: transform 0.4s cubic-bezier(0.16,1,0.3,1), opacity 0.4s;
    pointer-events: none;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* ── Responsive ── */
  @media (max-width: 600px) {
    #landing h1 { font-size: 1.8rem; }
    .landing-features { flex-direction: column; gap: 16px; }
    .top-bar { top: 8px; padding: 4px 6px; }
    .mode-btn { padding: 6px 12px; font-size: 0.75rem; }
    .side-bar { right: 8px; }
    .freq-legend { left: 8px; bottom: 8px; }
    .pitch-display { left: 8px; top: 8px; }
  }
</style>
</head>
<body>

<!-- Landing -->
<div id="landing">
  <div class="landing-icon">
    <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
  </div>
  <h1>Voice Canvas</h1>
  <p>소리로 그리는 캔버스 — 당신의 목소리가 작품이 됩니다</p>
  <button class="start-btn" id="startBtn">마이크 시작하기</button>
  <div class="landing-features">
    <div class="landing-feature">
      <div class="feat-icon">&#127908;</div>
      <h3>음량 → 굵기</h3>
      <p>큰 소리는 굵은 획, 작은 소리는 가는 선</p>
    </div>
    <div class="landing-feature">
      <div class="feat-icon">&#127912;</div>
      <h3>주파수 → 색상</h3>
      <p>저음은 따뜻한 색, 고음은 차가운 색</p>
    </div>
    <div class="landing-feature">
      <div class="feat-icon">&#10024;</div>
      <h3>3가지 모드</h3>
      <p>원형, 자유, 파동 브러시 경로</p>
    </div>
  </div>
</div>

<!-- Canvas -->
<canvas id="canvas"></canvas>

<!-- Top Bar -->
<div class="top-bar" id="topBar">
  <button class="mode-btn active" data-mode="orbit">Orbit</button>
  <button class="mode-btn" data-mode="free">Free</button>
  <button class="mode-btn" data-mode="wave">Wave</button>
  <div class="bar-divider"></div>
  <div class="vol-meter">
    <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
    <div class="vol-bar-wrap">
      <div class="vol-bar-fill" id="volFill"></div>
    </div>
  </div>
</div>

<!-- Side Toolbar -->
<div class="side-bar" id="sideBar">
  <button class="tool-btn" id="clearBtn">
    <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
    <span class="tooltip">지우기</span>
  </button>
  <button class="tool-btn" id="saveBtn">
    <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
    <span class="tooltip">PNG 저장</span>
  </button>
  <button class="tool-btn" id="fullscreenBtn">
    <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
    <span class="tooltip">전체화면</span>
  </button>
  <button class="tool-btn" id="trailBtn">
    <svg viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9c.83 0 1.5-.67 1.5-1.5 0-.39-.15-.74-.39-1.01-.23-.26-.38-.61-.38-1-.01-.83.67-1.49 1.5-1.49H16c2.76 0 5-2.24 5-5 0-4.42-4.03-8-9-8zm-5.5 9c-.83 0-1.5-.67-1.5-1.5S5.67 9 6.5 9 8 9.67 8 10.5 7.33 12 6.5 12zm3-4C8.67 8 8 7.33 8 6.5S8.67 5 9.5 5s1.5.67 1.5 1.5S10.33 8 9.5 8zm5 0c-.83 0-1.5-.67-1.5-1.5S13.67 5 14.5 5s1.5.67 1.5 1.5S15.33 8 14.5 8zm3 4c-.83 0-1.5-.67-1.5-1.5S16.67 9 17.5 9s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
    <span class="tooltip">잔상 효과</span>
  </button>
</div>

<!-- Pitch Display -->
<div class="pitch-display" id="pitchDisplay">
  <div class="label">주파수</div>
  <div class="value" id="pitchValue">—</div>
  <div class="hz" id="pitchHz"></div>
</div>

<!-- Frequency Legend -->
<div class="freq-legend" id="freqLegend">
  <h4>주파수 → 색상</h4>
  <div class="legend-row"><div class="legend-swatch" style="background:#ef4444"></div>저음 (~200Hz)</div>
  <div class="legend-row"><div class="legend-swatch" style="background:#f59e0b"></div>저중음 (~400Hz)</div>
  <div class="legend-row"><div class="legend-swatch" style="background:#22c55e"></div>중음 (~800Hz)</div>
  <div class="legend-row"><div class="legend-swatch" style="background:#3b82f6"></div>중고음 (~1.5kHz)</div>
  <div class="legend-row"><div class="legend-swatch" style="background:#a855f7"></div>고음 (~3kHz+)</div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
(() => {
  // ── State ──
  let audioCtx, analyser, dataArray, freqArray, source, stream;
  let canvas, ctx;
  let mode = 'orbit';
  let isRunning = false;
  let trailEnabled = true;
  let mouseX = 0, mouseY = 0;
  let orbitAngle = 0;
  let waveX = 0;
  let animId;

  // Audio analysis params
  const FFT_SIZE = 2048;
  const SILENCE_THRESHOLD = 0.015;
  const MIN_BRUSH = 2;
  const MAX_BRUSH = 60;

  // ── DOM ──
  const landing = document.getElementById('landing');
  const startBtn = document.getElementById('startBtn');
  const topBar = document.getElementById('topBar');
  const sideBar = document.getElementById('sideBar');
  const freqLegend = document.getElementById('freqLegend');
  const pitchDisplay = document.getElementById('pitchDisplay');
  const volFill = document.getElementById('volFill');
  const pitchValue = document.getElementById('pitchValue');
  const pitchHz = document.getElementById('pitchHz');
  const toastEl = document.getElementById('toast');

  // ── Canvas Setup ──
  canvas = document.getElementById('canvas');
  ctx = canvas.getContext('2d');

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  // Fill dark background
  function clearCanvas() {
    ctx.fillStyle = '#0a0e1a';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }
  clearCanvas();

  // ── Toast ──
  let toastTimer;
  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2000);
  }

  // ── Mouse/Touch Tracking ──
  function trackPointer(e) {
    if (e.touches) {
      mouseX = e.touches[0].clientX;
      mouseY = e.touches[0].clientY;
    } else {
      mouseX = e.clientX;
      mouseY = e.clientY;
    }
  }
  window.addEventListener('mousemove', trackPointer);
  window.addEventListener('touchmove', trackPointer, { passive: true });

  // ── Audio Setup ──
  async function initAudio() {
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = FFT_SIZE;
      analyser.smoothingTimeConstant = 0.8;
      source = audioCtx.createMediaStreamSource(stream);
      source.connect(analyser);
      dataArray = new Float32Array(analyser.fftSize);
      freqArray = new Uint8Array(analyser.frequencyBinCount);
      return true;
    } catch (err) {
      showToast('마이크 접근이 거부되었습니다');
      console.error(err);
      return false;
    }
  }

  // ── Audio Analysis ──
  function getRMS() {
    analyser.getFloatTimeDomainData(dataArray);
    let sum = 0;
    for (let i = 0; i < dataArray.length; i++) {
      sum += dataArray[i] * dataArray[i];
    }
    return Math.sqrt(sum / dataArray.length);
  }

  function getDominantFrequency() {
    analyser.getByteFrequencyData(freqArray);
    let maxVal = 0, maxIdx = 0;
    // Skip very low bins (noise)
    for (let i = 2; i < freqArray.length; i++) {
      if (freqArray[i] > maxVal) {
        maxVal = freqArray[i];
        maxIdx = i;
      }
    }
    const nyquist = audioCtx.sampleRate / 2;
    return (maxIdx / freqArray.length) * nyquist;
  }

  function getSpectralSpread() {
    analyser.getByteFrequencyData(freqArray);
    let total = 0;
    let weightedSum = 0;
    for (let i = 0; i < freqArray.length; i++) {
      total += freqArray[i];
      weightedSum += freqArray[i] * i;
    }
    if (total === 0) return 0;
    const centroid = weightedSum / total;
    let variance = 0;
    for (let i = 0; i < freqArray.length; i++) {
      variance += freqArray[i] * Math.pow(i - centroid, 2);
    }
    variance /= total;
    // Normalize: higher spread = more diffuse sound
    return Math.min(Math.sqrt(variance) / (freqArray.length * 0.3), 1);
  }

  // ── Frequency to Color ──
  function freqToHue(freq) {
    // Map frequency range (~80Hz - 4000Hz) to hue
    // Low = warm (red/orange 0-60), Mid = green/cyan (60-180), High = blue/purple (180-300)
    const minF = 80, maxF = 4000;
    const t = Math.max(0, Math.min(1, (Math.log2(freq) - Math.log2(minF)) / (Math.log2(maxF) - Math.log2(minF))));
    return t * 300; // 0 (red) to 300 (magenta)
  }

  function freqToColor(freq, alpha) {
    const hue = freqToHue(freq);
    return `hsla(${hue}, 85%, 60%, ${alpha})`;
  }

  // ── Note name from frequency ──
  function freqToNote(freq) {
    if (freq < 60) return '—';
    const noteNames = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
    const noteNum = 12 * (Math.log2(freq / 440)) + 69;
    const note = noteNames[Math.round(noteNum) % 12];
    const octave = Math.floor(Math.round(noteNum) / 12) - 1;
    return `${note}${octave}`;
  }

  // ── Brush Drawing ──
  function drawBrush(x, y, size, color) {
    const gradient = ctx.createRadialGradient(x, y, 0, x, y, size);
    gradient.addColorStop(0, color);
    gradient.addColorStop(0.5, color.replace(/[\d.]+\)$/, (m) => `${parseFloat(m) * 0.5})`));
    gradient.addColorStop(1, 'transparent');
    ctx.beginPath();
    ctx.arc(x, y, size, 0, Math.PI * 2);
    ctx.fillStyle = gradient;
    ctx.fill();
  }

  // ── Get Position by Mode ──
  function getPosition(rms) {
    const cx = canvas.width / 2;
    const cy = canvas.height / 2;

    switch (mode) {
      case 'orbit': {
        // Orbit: radius modulated by volume, angle advances steadily
        const baseRadius = Math.min(cx, cy) * 0.35;
        const radius = baseRadius + rms * 600;
        orbitAngle += 0.015 + rms * 0.08;
        return {
          x: cx + Math.cos(orbitAngle) * radius,
          y: cy + Math.sin(orbitAngle) * radius
        };
      }
      case 'free': {
        // Free: follows mouse/touch position
        return { x: mouseX, y: mouseY };
      }
      case 'wave': {
        // Wave: moves left to right, y oscillates with frequency
        waveX += 1.5 + rms * 4;
        if (waveX > canvas.width + 50) waveX = -50;
        const freq = getDominantFrequency();
        const waveY = cy + Math.sin(waveX * 0.01 + freq * 0.002) * (100 + rms * 300);
        return { x: waveX, y: waveY };
      }
      default:
        return { x: cx, y: cy };
    }
  }

  // ── Main Loop ──
  function render() {
    if (!isRunning) return;
    animId = requestAnimationFrame(render);

    const rms = getRMS();
    const freq = getDominantFrequency();
    const spread = getSpectralSpread();

    // Update UI meters
    const volPct = Math.min(rms * 500, 100);
    volFill.style.width = `${volPct}%`;

    if (rms > SILENCE_THRESHOLD) {
      pitchValue.textContent = freqToNote(freq);
      pitchHz.textContent = `${Math.round(freq)} Hz`;
    } else {
      pitchValue.textContent = '—';
      pitchHz.textContent = '';
    }

    // Trail effect: dim previous frame
    if (trailEnabled) {
      ctx.fillStyle = 'rgba(10, 14, 26, 0.02)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    // Only draw if above silence threshold
    if (rms > SILENCE_THRESHOLD) {
      const brushSize = MIN_BRUSH + (rms * 400) * ((MAX_BRUSH - MIN_BRUSH) / 100);
      const clampedSize = Math.min(brushSize, MAX_BRUSH);

      // Alpha: inversely related to spectral spread (pure tone = opaque, noise = translucent)
      const alpha = 0.3 + (1 - spread) * 0.6;
      const color = freqToColor(freq, alpha);
      const pos = getPosition(rms);

      drawBrush(pos.x, pos.y, clampedSize, color);

      // Secondary particles for rich sounds
      if (rms > 0.06) {
        const particleCount = Math.floor(rms * 30);
        for (let i = 0; i < particleCount; i++) {
          const angle = Math.random() * Math.PI * 2;
          const dist = Math.random() * clampedSize * 2;
          const px = pos.x + Math.cos(angle) * dist;
          const py = pos.y + Math.sin(angle) * dist;
          const pSize = Math.random() * clampedSize * 0.3;
          const pAlpha = alpha * 0.3 * Math.random();
          drawBrush(px, py, pSize, freqToColor(freq + (Math.random() - 0.5) * 200, pAlpha));
        }
      }
    }
  }

  // ── Mode Buttons ──
  document.querySelectorAll('.mode-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      mode = btn.dataset.mode;
      if (mode === 'wave') waveX = 0;
      if (mode === 'orbit') orbitAngle = 0;
      showToast(`${mode.charAt(0).toUpperCase() + mode.slice(1)} 모드`);
    });
  });

  // ── Tool Buttons ──
  document.getElementById('clearBtn').addEventListener('click', () => {
    clearCanvas();
    showToast('캔버스를 지웠습니다');
  });

  document.getElementById('saveBtn').addEventListener('click', () => {
    const link = document.createElement('a');
    link.download = `voice-canvas-${Date.now()}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
    showToast('PNG 저장 완료');
  });

  document.getElementById('fullscreenBtn').addEventListener('click', () => {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(() => {});
    } else {
      document.exitFullscreen();
    }
  });

  document.getElementById('trailBtn').addEventListener('click', () => {
    trailEnabled = !trailEnabled;
    showToast(trailEnabled ? '잔상 효과 ON' : '잔상 효과 OFF');
  });

  // ── Start ──
  startBtn.addEventListener('click', async () => {
    const ok = await initAudio();
    if (!ok) return;

    landing.classList.add('hidden');
    isRunning = true;

    // Show UI
    setTimeout(() => {
      topBar.classList.add('visible');
      sideBar.classList.add('visible');
      freqLegend.classList.add('visible');
      pitchDisplay.classList.add('visible');
    }, 400);

    // Set initial mouse to center
    mouseX = canvas.width / 2;
    mouseY = canvas.height / 2;

    render();
    showToast('소리를 내보세요!');
  });

  // ── Keyboard Shortcuts ──
  window.addEventListener('keydown', (e) => {
    if (!isRunning) return;
    switch (e.key) {
      case '1': document.querySelector('[data-mode="orbit"]').click(); break;
      case '2': document.querySelector('[data-mode="free"]').click(); break;
      case '3': document.querySelector('[data-mode="wave"]').click(); break;
      case 'c': case 'C': document.getElementById('clearBtn').click(); break;
      case 's': case 'S':
        if (!e.ctrlKey && !e.metaKey) document.getElementById('saveBtn').click();
        break;
      case 'f': case 'F': document.getElementById('fullscreenBtn').click(); break;
      case 't': case 'T': document.getElementById('trailBtn').click(); break;
    }
  });
})();
</script>
</body>
</html>
