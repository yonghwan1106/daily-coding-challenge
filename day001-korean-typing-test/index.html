<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>한글 타자 속도 테스트</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Pretendard', 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
    background: #0f0f1a;
    color: #e0e0e0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .container {
    width: 100%;
    max-width: 720px;
    padding: 20px;
  }

  h1 {
    text-align: center;
    font-size: 2rem;
    font-weight: 700;
    margin-bottom: 8px;
    background: linear-gradient(135deg, #6ee7b7, #3b82f6);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .subtitle {
    text-align: center;
    color: #64748b;
    font-size: 0.9rem;
    margin-bottom: 32px;
  }

  .sentence-box {
    background: #1a1a2e;
    border: 1px solid #2a2a4a;
    border-radius: 12px;
    padding: 24px;
    margin-bottom: 16px;
    min-height: 80px;
    line-height: 2;
    font-size: 1.2rem;
    letter-spacing: 0.5px;
    position: relative;
    overflow-wrap: break-word;
  }

  .sentence-box .char {
    display: inline;
    transition: color 0.1s;
  }

  .sentence-box .char.correct { color: #4ade80; }
  .sentence-box .char.incorrect {
    color: #f87171;
    text-decoration: underline;
    text-decoration-color: #f8717180;
  }
  .sentence-box .char.pending { color: #4a4a6a; }
  .sentence-box .char.current {
    color: #e0e0e0;
    border-bottom: 2px solid #3b82f6;
    animation: blink 1s step-end infinite;
  }

  @keyframes blink {
    50% { border-bottom-color: transparent; }
  }

  .input-area {
    width: 100%;
    background: #16162a;
    border: 2px solid #2a2a4a;
    border-radius: 12px;
    padding: 16px 20px;
    font-size: 1.1rem;
    color: #e0e0e0;
    outline: none;
    resize: none;
    height: 60px;
    line-height: 1.6;
    transition: border-color 0.2s;
    font-family: inherit;
  }

  .input-area:focus { border-color: #3b82f6; }
  .input-area:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .stats-bar {
    display: flex;
    justify-content: center;
    gap: 32px;
    margin: 20px 0;
    flex-wrap: wrap;
  }

  .stat-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 1rem;
  }

  .stat-icon { font-size: 1.2rem; }
  .stat-value {
    font-weight: 700;
    font-size: 1.3rem;
    color: #fff;
    min-width: 48px;
    text-align: right;
  }
  .stat-label {
    color: #64748b;
    font-size: 0.85rem;
  }

  .buttons {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-top: 24px;
  }

  .btn {
    padding: 12px 28px;
    border: none;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.1s, box-shadow 0.2s;
    font-family: inherit;
  }

  .btn:hover { transform: translateY(-1px); }
  .btn:active { transform: translateY(0); }

  .btn-primary {
    background: linear-gradient(135deg, #3b82f6, #6366f1);
    color: #fff;
    box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
  }

  .btn-secondary {
    background: #2a2a4a;
    color: #e0e0e0;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
  }

  /* Result overlay */
  .result-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.7);
    backdrop-filter: blur(8px);
    z-index: 100;
    justify-content: center;
    align-items: center;
  }

  .result-overlay.show {
    display: flex;
    animation: fadeIn 0.3s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .result-card {
    background: #1a1a2e;
    border: 1px solid #2a2a4a;
    border-radius: 20px;
    padding: 40px;
    text-align: center;
    max-width: 420px;
    width: 90%;
    animation: slideUp 0.4s ease;
  }

  @keyframes slideUp {
    from { transform: translateY(30px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  .result-grade {
    font-size: 4rem;
    margin-bottom: 4px;
  }

  .result-grade-label {
    font-size: 1.5rem;
    font-weight: 700;
    margin-bottom: 24px;
    background: linear-gradient(135deg, #6ee7b7, #3b82f6);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .result-stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 28px;
  }

  .result-stat {
    background: #12122a;
    border-radius: 12px;
    padding: 16px;
  }

  .result-stat-value {
    font-size: 1.6rem;
    font-weight: 700;
    color: #fff;
  }

  .result-stat-label {
    font-size: 0.8rem;
    color: #64748b;
    margin-top: 4px;
  }

  .result-buttons {
    display: flex;
    gap: 12px;
    justify-content: center;
  }

  .progress-bar {
    width: 100%;
    height: 4px;
    background: #2a2a4a;
    border-radius: 2px;
    margin-bottom: 20px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #3b82f6, #6ee7b7);
    border-radius: 2px;
    transition: width 0.15s ease;
    width: 0%;
  }

  .sentence-info {
    display: flex;
    justify-content: space-between;
    margin-bottom: 8px;
    font-size: 0.8rem;
    color: #64748b;
  }

  @media (max-width: 480px) {
    h1 { font-size: 1.5rem; }
    .sentence-box { font-size: 1rem; padding: 16px; }
    .stats-bar { gap: 16px; }
    .stat-value { font-size: 1.1rem; }
    .result-card { padding: 28px 20px; }
  }
</style>
</head>
<body>
<div class="container">
  <h1>한글 타자 속도 테스트</h1>
  <p class="subtitle">문장을 보고 정확하게 따라 입력하세요</p>

  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>

  <div class="sentence-info">
    <span id="sentenceNum">문장 1 / 1</span>
    <span id="charCount">0 / 0 글자</span>
  </div>

  <div class="sentence-box" id="sentenceBox"></div>

  <textarea class="input-area" id="inputArea" placeholder="여기에 입력하세요..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea>

  <div class="stats-bar">
    <div class="stat-item">
      <span class="stat-icon">&#9201;</span>
      <span class="stat-value" id="timerDisplay">0:00</span>
      <span class="stat-label">경과</span>
    </div>
    <div class="stat-item">
      <span class="stat-icon">&#9997;</span>
      <span class="stat-value" id="wpmDisplay">0</span>
      <span class="stat-label">타/분</span>
    </div>
    <div class="stat-item">
      <span class="stat-icon">&#127919;</span>
      <span class="stat-value" id="accuracyDisplay">100%</span>
      <span class="stat-label">정확도</span>
    </div>
  </div>

  <div class="buttons">
    <button class="btn btn-secondary" onclick="restartSame()">다시 시작</button>
    <button class="btn btn-primary" onclick="nextSentence()">다음 문장</button>
  </div>
</div>

<!-- Result Overlay -->
<div class="result-overlay" id="resultOverlay">
  <div class="result-card">
    <div class="result-grade" id="resultGradeIcon"></div>
    <div class="result-grade-label" id="resultGradeLabel"></div>
    <div class="result-stats">
      <div class="result-stat">
        <div class="result-stat-value" id="resultWpm">0</div>
        <div class="result-stat-label">타/분</div>
      </div>
      <div class="result-stat">
        <div class="result-stat-value" id="resultAccuracy">0%</div>
        <div class="result-stat-label">정확도</div>
      </div>
      <div class="result-stat">
        <div class="result-stat-value" id="resultTime">0:00</div>
        <div class="result-stat-label">소요 시간</div>
      </div>
      <div class="result-stat">
        <div class="result-stat-value" id="resultKeystrokes">0</div>
        <div class="result-stat-label">총 타수</div>
      </div>
    </div>
    <div class="result-buttons">
      <button class="btn btn-secondary" onclick="closeResult(); restartSame();">다시 도전</button>
      <button class="btn btn-primary" onclick="closeResult(); nextSentence();">다음 문장</button>
    </div>
  </div>
</div>

<script>
const sentences = [
  "가는 말이 고와야 오는 말이 곱다",
  "하늘이 무너져도 솟아날 구멍이 있다",
  "서당 개 삼 년이면 풍월을 읊는다",
  "고생 끝에 낙이 온다",
  "백지장도 맞들면 낫다",
  "뜻이 있는 곳에 길이 있다",
  "천 리 길도 한 걸음부터 시작된다",
  "시작이 반이다",
  "호랑이도 제 말 하면 온다",
  "소 잃고 외양간 고친다",
  "오늘 할 일을 내일로 미루지 마라",
  "아는 것이 힘이다",
  "실패는 성공의 어머니이다",
  "낮말은 새가 듣고 밤말은 쥐가 듣는다",
  "공든 탑이 무너지랴",
  "세상에서 가장 아름다운 것은 보이지 않는다",
  "배움에는 끝이 없고 노력에는 한계가 없다",
  "꿈을 꾸는 사람만이 그 꿈을 이룰 수 있다",
  "작은 것에도 감사할 줄 아는 사람이 행복하다",
  "매일 조금씩 나아가면 결국 목표에 도달한다",
  "비 온 뒤에 땅이 굳어진다",
  "바람이 불지 않으면 노를 저어라",
  "인생은 짧고 예술은 길다",
  "가장 어두운 밤도 결국 새벽이 온다",
  "우리가 두려워할 것은 두려움 그 자체뿐이다",
];

let currentSentence = "";
let currentIndex = 0;
let sentenceIndex = 0;
let startTime = null;
let timerInterval = null;
let isStarted = false;
let isFinished = false;
let totalKeystrokes = 0;
let correctKeystrokes = 0;

// Shuffle sentences
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

let shuffled = shuffle(sentences);

function init() {
  currentSentence = shuffled[sentenceIndex % shuffled.length];
  currentIndex = 0;
  startTime = null;
  isStarted = false;
  isFinished = false;
  totalKeystrokes = 0;
  correctKeystrokes = 0;

  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }

  document.getElementById("timerDisplay").textContent = "0:00";
  document.getElementById("wpmDisplay").textContent = "0";
  document.getElementById("accuracyDisplay").textContent = "100%";
  document.getElementById("progressFill").style.width = "0%";
  document.getElementById("sentenceNum").textContent =
    `문장 ${(sentenceIndex % shuffled.length) + 1} / ${shuffled.length}`;
  document.getElementById("charCount").textContent = `0 / ${currentSentence.length} 글자`;

  const inputArea = document.getElementById("inputArea");
  inputArea.value = "";
  inputArea.disabled = false;
  inputArea.focus();

  renderSentence();
}

function renderSentence() {
  const box = document.getElementById("sentenceBox");
  const inputVal = document.getElementById("inputArea").value;
  let html = "";

  for (let i = 0; i < currentSentence.length; i++) {
    let cls = "pending";
    if (i < inputVal.length) {
      cls = inputVal[i] === currentSentence[i] ? "correct" : "incorrect";
    } else if (i === inputVal.length) {
      cls = "current";
    }
    const ch = currentSentence[i] === " " ? "&nbsp;" : escapeHtml(currentSentence[i]);
    html += `<span class="char ${cls}">${ch}</span>`;
  }

  box.innerHTML = html;
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

function startTimer() {
  if (isStarted) return;
  isStarted = true;
  startTime = Date.now();
  timerInterval = setInterval(updateTimer, 100);
}

function updateTimer() {
  if (!startTime) return;
  const elapsed = (Date.now() - startTime) / 1000;
  const min = Math.floor(elapsed / 60);
  const sec = Math.floor(elapsed % 60);
  document.getElementById("timerDisplay").textContent =
    `${min}:${sec.toString().padStart(2, "0")}`;
}

function calcWpm() {
  if (!startTime) return 0;
  const elapsedMin = (Date.now() - startTime) / 60000;
  if (elapsedMin < 0.01) return 0;
  return Math.round(totalKeystrokes / elapsedMin);
}

function calcAccuracy() {
  if (totalKeystrokes === 0) return 100;
  return Math.round((correctKeystrokes / totalKeystrokes) * 100);
}

function getGrade(wpm) {
  if (wpm >= 400) return { icon: "\u26A1", label: "번개" };
  if (wpm >= 300) return { icon: "\uD83D\uDC06", label: "치타" };
  if (wpm >= 200) return { icon: "\uD83D\uDC0E", label: "말" };
  if (wpm >= 100) return { icon: "\uD83D\uDC07", label: "토끼" };
  return { icon: "\uD83D\uDC22", label: "거북이" };
}

function showResult() {
  const wpm = calcWpm();
  const accuracy = calcAccuracy();
  const elapsed = (Date.now() - startTime) / 1000;
  const min = Math.floor(elapsed / 60);
  const sec = Math.floor(elapsed % 60);
  const grade = getGrade(wpm);

  document.getElementById("resultGradeIcon").textContent = grade.icon;
  document.getElementById("resultGradeLabel").textContent = grade.label;
  document.getElementById("resultWpm").textContent = wpm;
  document.getElementById("resultAccuracy").textContent = accuracy + "%";
  document.getElementById("resultTime").textContent =
    `${min}:${sec.toString().padStart(2, "0")}`;
  document.getElementById("resultKeystrokes").textContent = totalKeystrokes;

  document.getElementById("resultOverlay").classList.add("show");
}

function closeResult() {
  document.getElementById("resultOverlay").classList.remove("show");
}

function finishTest() {
  isFinished = true;
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  updateTimer();

  document.getElementById("inputArea").disabled = true;
  document.getElementById("wpmDisplay").textContent = calcWpm();
  document.getElementById("accuracyDisplay").textContent = calcAccuracy() + "%";
  document.getElementById("progressFill").style.width = "100%";

  setTimeout(showResult, 300);
}

function restartSame() {
  init();
}

function nextSentence() {
  sentenceIndex++;
  if (sentenceIndex >= shuffled.length) {
    shuffled = shuffle(sentences);
    sentenceIndex = 0;
  }
  init();
}

// Input handler
document.getElementById("inputArea").addEventListener("input", function (e) {
  if (isFinished) return;

  const val = this.value;

  // Start timer on first input
  if (!isStarted && val.length > 0) {
    startTimer();
  }

  // Count keystrokes: compare last character typed
  if (val.length > currentIndex) {
    // Characters were added
    for (let i = currentIndex; i < val.length && i < currentSentence.length; i++) {
      totalKeystrokes++;
      if (val[i] === currentSentence[i]) {
        correctKeystrokes++;
      }
    }
  }
  currentIndex = val.length;

  // Update displays
  renderSentence();
  const progress = Math.min((val.length / currentSentence.length) * 100, 100);
  document.getElementById("progressFill").style.width = progress + "%";
  document.getElementById("charCount").textContent =
    `${Math.min(val.length, currentSentence.length)} / ${currentSentence.length} 글자`;

  if (isStarted) {
    document.getElementById("wpmDisplay").textContent = calcWpm();
    document.getElementById("accuracyDisplay").textContent = calcAccuracy() + "%";
  }

  // Check if complete
  if (val.length >= currentSentence.length) {
    finishTest();
  }
});

// Prevent paste
document.getElementById("inputArea").addEventListener("paste", function (e) {
  e.preventDefault();
});

// Keyboard shortcut: Escape to restart, Tab to next
document.addEventListener("keydown", function (e) {
  if (e.key === "Escape") {
    closeResult();
    restartSame();
  }
  if (e.key === "Tab") {
    e.preventDefault();
    closeResult();
    nextSentence();
  }
});

// Initialize
init();
</script>
</body>
</html>
